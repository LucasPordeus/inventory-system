<mat-toolbar  [ngClass]="!isCollapsed ? 'expanded' : ''">
  <button mat-icon-button aria-label="Menu icon" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
  @if (!isCollapsed) {
    <h1>Menu</h1>
  }

</mat-toolbar>

<mat-sidenav-container autosize="true">
  <mat-sidenav [ngClass]="!isCollapsed ? 'expanded' : ''" [mode]="isMobile ? 'over' : 'side'" [opened]="isMobile ? false : true">
    <mat-nav-list>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>bar_chart_4_bars</mat-icon>          
            @if(!isCollapsed){
              <span>Dashboard</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>inventory_2</mat-icon>
            @if(!isCollapsed){
              <span>Produtos</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>warehouse</mat-icon>
            @if(!isCollapsed){
              <span>Fornecedores</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>compare_arrows</mat-icon>
            @if(!isCollapsed){
              <span>Movimentação</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>groups</mat-icon>
            @if(!isCollapsed){
              <span>Usuários</span>
            }
        </span>
      </a>
    </mat-nav-list>

    @if(!isCollapsed){
      <div class="brand">
        <h1>StoCat</h1>
        <img src="assets/images/logo.png" class="logo" alt="logo">
        <div class="circle" class="circle"></div>
      </div>
    }
  </mat-sidenav>
  <mat-sidenav-content>
    <h2>Content</h2>
    <div class="grid">
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>  
      <div class="square"></div>
      <div class="square"></div>
    </div>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
