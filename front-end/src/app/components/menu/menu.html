<mat-toolbar >
  <button mat-icon-button aria-label="Menu icon" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="brand">
    <h1 class="title">StoCat</h1>
    <img src="assets/images/logo.png" class="logo" alt="logo">
  </div>
  <div class="profile">
    <img src="assets/images/person-profile.png" class="profile_image" alt="profile_image">
  </div>
</mat-toolbar>

<mat-sidenav-container autosize="true">
  <mat-sidenav [ngClass]="!isCollapsed ? 'expanded' : 'side'" [mode]="isMobile ? 'over' : 'side'" [opened]="isMobile ? false : true" [disableClose]="true">
    <mat-nav-list>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>bar_chart_4_bars</mat-icon>          
            @if(!isCollapsed){
              <span>Dashboard</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>inventory_2</mat-icon>
            @if(!isCollapsed){
              <span>Produtos</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>warehouse</mat-icon>
            @if(!isCollapsed){
              <span>Fornecedores</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>compare_arrows</mat-icon>
            @if(!isCollapsed){
              <span>Movimentação</span>
            }
        </span>
      </a>
      <a mat-list-item>
        <span class="entry"> 
          <mat-icon>groups</mat-icon>
            @if(!isCollapsed){
              <span>Usuários</span>
            }
        </span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <h2>Content</h2>
    <div class="grid">
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
    </div>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
